<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Emblème Région Occitanie">
  <!-- Fond rouge Occitanie -->
  <rect width="120" height="120" rx="12" fill="#C1003E"/>

  <!-- Croix occitane (Croix de Toulouse) en or, 12 boules -->
  <!-- La croix occitane : une croix grecque avec 3 boules à chaque extrémité -->

  <!-- Bras horizontal central -->
  <rect x="22" y="50" width="76" height="20" rx="5" fill="#F0A500"/>
  <!-- Bras vertical central -->
  <rect x="50" y="22" width="20" height="76" rx="5" fill="#F0A500"/>

  <!-- Boules extrémité HAUT (3) -->
  <circle cx="50" cy="18" r="7" fill="#F0A500"/>
  <circle cx="60" cy="13" r="7" fill="#F0A500"/>
  <circle cx="70" cy="18" r="7" fill="#F0A500"/>

  <!-- Boules extrémité BAS (3) -->
  <circle cx="50" cy="102" r="7" fill="#F0A500"/>
  <circle cx="60" cy="107" r="7" fill="#F0A500"/>
  <circle cx="70" cy="102" r="7" fill="#F0A500"/>

  <!-- Boules extrémité GAUCHE (3) -->
  <circle cx="18" cy="50" r="7" fill="#F0A500"/>
  <circle cx="13" cy="60" r="7" fill="#F0A500"/>
  <circle cx="18" cy="70" r="7" fill="#F0A500"/>

  <!-- Boules extrémité DROITE (3) -->
  <circle cx="102" cy="50" r="7" fill="#F0A500"/>
  <circle cx="107" cy="60" r="7" fill="#F0A500"/>
  <circle cx="102" cy="70" r="7" fill="#F0A500"/>
</svg>
